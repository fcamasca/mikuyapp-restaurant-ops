name: CI

on:
  push:
    branches:
      - main
      - feature/h1-TechnicalBasis
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-ci-placeholder
      MIKUY_ENVIRONMENT_STATE: LEGACY_SHARED
      MIKUY_LOGICAL_ENVIRONMENT: DEV
      MIKUY_EXPECTED_SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
      MIKUY_DEV_SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Environment guard tests
        run: npm run test:environment

      - name: Build
        run: npm run build
